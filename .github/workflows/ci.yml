# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Build and smoke test (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
            bpftool_sha256: 68862a7038a269e1d4af5fed53d2b4d763f1cd82a96caa49b76596453bae0c3e
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            bpftool_sha256: 99a6dcc2e0e35d5dbb4b79ebe6c83670317d82e9139f2eb23d3e69fc032139aa

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            clang \
            curl \
            libbpf-dev \
            libelf-dev \
            libevent-dev \
            libuv1-dev \
            llvm \
            pkg-config \
            zlib1g-dev

      - name: Install bpftool
        env:
          BPFTOOL_VERSION: v7.4.0
          BPFTOOL_ARCH: ${{ matrix.architecture }}
          BPFTOOL_SHA256: ${{ matrix.bpftool_sha256 }}
        run: |
          bpftool_archive="$RUNNER_TEMP/bpftool.tar.gz"
          bpftool_dir="$RUNNER_TEMP/bpftool"
          curl --fail --location --silent --show-error \
            --output "$bpftool_archive" \
            "https://github.com/libbpf/bpftool/releases/download/$BPFTOOL_VERSION/bpftool-$BPFTOOL_VERSION-$BPFTOOL_ARCH.tar.gz"
          echo "$BPFTOOL_SHA256  $bpftool_archive" | sha256sum --check
          mkdir --parents "$bpftool_dir"
          tar --extract --gzip --file "$bpftool_archive" --directory "$bpftool_dir"
          bpftool_path="$bpftool_dir/bpftool"
          chmod 0755 "$bpftool_path"
          test -x "$bpftool_path"
          echo "BPFTOOL=$bpftool_path" >> "$GITHUB_ENV"
          "$bpftool_path" version

      - name: Check runner BTF
        run: test -r /sys/kernel/btf/vmlinux

      - name: Build all targets
        run: |
          set -o pipefail
          make clean
          build_log="$RUNNER_TEMP/callweave-build.log"
          if ! make 2>&1 | tee "$build_log"; then
            message="$(tail --lines 80 "$build_log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Build all targets failed::$message"
            exit 1
          fi

      - name: Validate example configurations
        run: |
          set -o pipefail
          validation_log="$RUNNER_TEMP/callweave-config-validation.log"
          if ! {
            ./callweave --check-config examples/thread-pool.yaml
            ./callweave --check-config examples/complex-multi-hop.yaml
          } 2>&1 | tee "$validation_log"; then
            message="$(tail --lines 40 "$validation_log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Configuration validation failed::$message"
            exit 1
          fi

      - name: Run userspace smoke tests
        run: |
          set -o pipefail
          smoke_log="$RUNNER_TEMP/callweave-smoke-tests.log"
          if ! {
            ./test/trace_report_test "$RUNNER_TEMP/callweave-report.html"
            timeout 15s ./test/trace_epoll_test 4
            timeout 15s ./test/trace_libuv_test 1
            timeout 15s ./test/trace_libevent_test \
              --startup-delay 0 \
              --iterations 8 \
              --lock-contention
          } 2>&1 | tee "$smoke_log"; then
            message="$(tail --lines 40 "$smoke_log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Userspace smoke tests failed::$message"
            exit 1
          fi
